<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">TgWitness — Telegram archives with a verifiable record</title>
<desc id="desc">A self-hosted Telegram investigation workspace. The journal illustration shows a new message, a saved edit and a deletion notice.</desc>
