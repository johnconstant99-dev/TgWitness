<svg xmlns="http://www.w3.org/2000/svg" width="640" height="352" viewBox="0 0 640 352" role="img" aria-labelledby="title desc">
<title id="title">TgWitness — Telegram archives with a verifiable record</title>
<desc id="desc">A self-hosted workspace to capture Telegram observations, investigate the archive and verify the saved record.</desc>
<defs><linearGradient id="surface" x2="1" y2="1"><stop stop-color="#132637"/><stop offset="1" stop-color="#09131e"/></linearGradient></defs>
<rect x="1" y="1" width="638" height="350" rx="18" fill="url(#surface)" stroke="#304859"/>
<path d="M32 38h26" stroke="#e5bf83" stroke-width="3" stroke-linecap="round"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="72" y="43" fill="#a8bdcc" font-size="14" letter-spacing="1.8">PHISHDESTROY / OPEN SOURCE</text>
<text x="27" y="145" fill="#f1f5f8" font-size="88" font-weight="700" letter-spacing="-4">TgWitness<tspan fill="#e5bf83">.</tspan></text>
<g fill="#b8cbd9" font-size="26"><text x="32" y="193">Telegram archives</text><text x="32" y="230">with a verifiable record.</text></g>
<path d="M32 266h576" stroke="#304859"/>
<text x="32" y="307" fill="#a3d9c3" font-size="17" letter-spacing="1">CAPTURE</text>
<text x="217" y="307" fill="#8acbf4" font-size="17" letter-spacing="1">INVESTIGATE</text>
<text x="484" y="307" fill="#e5bf83" font-size="17" letter-spacing="1">VERIFY</text>
<path d="M157 301h27m-6-4 6 4-6 4M421 301h27m-6-4 6 4-6 4" fill="none" stroke="#6b879b" stroke-width="1.5"/>
</g>
