name: Installer artifact and wheel smoke
on:
  pull_request:
    branches: [main]
    paths:
      - deploy/installer/**
      - deploy/installer.lock
      - tools/lock_requirements.py
      - pyproject.toml
      - tgwitness_capture/**
      - tgwitness/panelctl.py
      - tgwitness/operator_guide.py
      - tools/build_installer.py
      - tools/installer_publication.py
      - .github/workflows/installer-acceptance.yml
  workflow_dispatch:
    inputs:
      published:
        description: Authenticate and install the public wheel from this exact main commit
        type: boolean
        default: false
  workflow_call:
    inputs:
      artifact:
        description: Installer site built and signed by the calling workflow
        type: string
        required: true
      published:
        description: Authenticate current public HTTPS downloads
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: installer-acceptance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  install:
    name: Installed panel (${{ matrix.os }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        mode: [local]
    steps:
      - name: Record the installed-wheel smoke scope
        shell: bash
        run: printf '%s\n' 'This job authenticates installer artifacts and checks the installed wheel. Service setup, tunnels and bootstrap regressions run privately.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r deploy/build.lock
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r deploy/installer.lock'
      - name: Build with an ephemeral test key, without release credentials
        if: ${{ !inputs.artifact && !inputs.published }}
        run: python tools/build_installer.py --base-url https://installer.invalid --test-signing-key
      - name: Use the exact signed installer candidate
        if: inputs.artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.artifact }}
          path: dist/installer-site/
      - name: Authenticate the current public downloads
        if: inputs.published
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        shell: bash
        run: python tools/installer_publication.py download-current --site dist/installer-site --revision "$EXPECTED_REVISION"
      - name: Verify artifact signatures and the source revision
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EPHEMERAL_BUILD: ${{ !inputs.artifact && !inputs.published }}
        run: |
          options=()
          if [ "$EPHEMERAL_BUILD" = true ]; then options+=(--allow-test-key); fi
          python -I tools/installer_publication.py verify-local --revision "$EXPECTED_REVISION" "${options[@]}"
      - name: Install the verified wheel with its hash-locked dependencies
        shell: bash
        run: |
          python -I - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          site = Path("dist/installer-site")
          manifest = json.loads((site / "manifest.json").read_bytes())
          release = site / "releases" / manifest["release_id"]
          wheel, = (name for name in manifest["files"] if name.endswith(".whl"))
          subprocess.run([sys.executable, "-m", "pip", "install", "--require-hashes",
                          "--no-build-isolation", "-r", str(release / "requirements.lock")], check=True)
          subprocess.run([sys.executable, "-m", "pip", "install", "--no-deps", str(release / wheel)], check=True)
          PY
          python -m pip check
      - name: Check installed imports and empty-workspace readiness
        shell: bash
        run: |
          python -I -c "import tgwitness.app, tgwitness.verify, tgwitness_capture.service"
          python -I -m tgwitness --check --json --data-dir "$RUNNER_TEMP/installer-readiness"
